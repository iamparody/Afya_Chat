sections:
  cardinal_symptoms: |
    Lower UTI (cystitis) presents with dysuria — a burning or stinging sensation
    during urination — along with urinary frequency and urgency. Suprapubic
    discomfort or aching is common. Upper UTI (pyelonephritis) adds fever, loin
    pain (unilateral flank pain radiating to the groin), and costovertebral angle
    tenderness on examination, reflecting renal parenchymal involvement.

  associated_symptoms: |
    Haematuria — macroscopic or microscopic — occurs in both lower and upper UTI.
    Cloudy, offensive-smelling urine suggests significant pyuria. Systemic features
    — fever, rigors, nausea, and vomiting — are characteristic of pyelonephritis and
    distinguish it from uncomplicated cystitis. In elderly patients, confusion and
    functional decline may be the presenting features of a UTI with otherwise minimal
    urinary symptoms; however, asymptomatic bacteriuria is common in older adults and
    should not be treated unless specific criteria are met.

  diagnostic_features: |
    Positive urine dipstick for nitrites (high specificity for gram-negative
    bacteriuria) and/or leukocyte esterase (reflecting pyuria) is the appropriate
    first-line test for uncomplicated lower UTI in women. Pyuria on microscopy (≥10
    white blood cells per mm³ in unspun urine) confirms urinary tract inflammation.
    Midstream urine culture demonstrating ≥10⁵ colony-forming units per mL of a
    single uropathogen is the diagnostic gold standard; lower thresholds (≥10³
    CFU/mL) apply for symptomatic women and catheter specimens. Costovertebral angle
    tenderness on bimanual palpation, combined with fever, supports the diagnosis of
    pyelonephritis over cystitis.

  predisposing_factors: |
    Female sex is the most important structural risk factor due to the short urethra
    and its proximity to the perineum. Sexual intercourse increases exposure to
    uropathogens. Urinary catheters are the leading cause of healthcare-associated
    UTI. Structural abnormalities of the urinary tract — stones, strictures,
    vesicoureteral reflux, polycystic kidney disease — impair urinary flow and
    promote infection. Diabetes mellitus impairs immune defences and is associated
    with more complicated UTI. Pregnancy produces urinary stasis through
    progesterone-mediated ureteral dilatation, making asymptomatic bacteriuria
    clinically significant in this group. Immunocompromise (HIV, chemotherapy,
    corticosteroids) predisposes to atypical organisms.

  typical_presentation: |
    In a healthy, non-pregnant, sexually active woman, uncomplicated cystitis
    presents as acute dysuria, frequency, and urgency without fever or systemic
    features. Onset is typically over hours to a day. Pyelonephritis presents more
    dramatically with loin pain, fever ≥38°C, rigors, and systemic illness, often
    with a preceding or concurrent lower urinary tract symptoms. In men, a UTI at
    any age should prompt consideration of structural abnormality or prostatitis, as
    uncomplicated UTI is uncommon in men without predisposing factors.

  differential_diagnoses: |
    Urethritis due to sexually transmitted infections — chlamydia (Chlamydia
    trachomatis) or gonorrhoea (Neisseria gonorrhoeae) — produces dysuria and
    urethral discharge or vaginal discharge; it should be considered in sexually
    active young adults, especially when dipstick is negative or does not explain
    symptoms. Vaginitis (bacterial vaginosis, candidiasis, trichomoniasis) causes
    external dysuria from vulval irritation and vaginal discharge; symptoms are
    worsened by urination over an inflamed vulva rather than internal burning.
    Bladder and urethral stones cause dysuria and haematuria without infective
    features; pain may be positional. Overactive bladder syndrome produces urgency
    and frequency without dysuria or infective markers. Prostatitis in men causes
    perineal and lower back pain alongside lower urinary tract symptoms; the prostate
    is tender on digital rectal examination.

  argues_against: |
    Negative nitrite and negative leukocyte esterase on urine dipstick has a high
    negative predictive value for UTI in a symptomatic woman — both negative together
    makes bacterial UTI unlikely. Sterile pyuria — white cells present but no
    bacterial growth on culture — argues against a standard bacterial UTI and raises
    the possibility of urethritis from STI, renal TB, or interstitial nephritis.
    External dysuria described as burning over the vulval skin on contact with urine,
    accompanied by vaginal discharge or itch, is more consistent with vaginitis than
    cystitis; internal dysuria with urethral burning is the more specific symptom of
    cystitis. Normal urinalysis and negative culture in a symptomatic patient should
    prompt consideration of overactive bladder, vulvodynia, or pelvic floor
    dysfunction. Male sex without a urinary catheter, recent urological procedure, or
    documented structural abnormality argues against uncomplicated lower UTI — UTI in
    a man under 50 without a precipitating factor is atypical and should prompt
    consideration of prostatitis, epididymo-orchitis, or urological investigation
    rather than simple cystitis.

  red_flags: |
    Fever ≥38 °C, flank pain, or vomiting in a patient presenting with urinary
    symptoms indicates complicated or upper tract infection and is the primary-care
    referral trigger — refer to a higher level for care rather than treating as
    uncomplicated cystitis. Any one of the three is sufficient; they do not all need
    to be present.

    Signs of urosepsis — fever with tachycardia, hypotension, or altered
    consciousness in the context of a UTI — represent a medical emergency requiring
    immediate parenteral antibiotics, fluid resuscitation, and intensive monitoring.
    Pyelonephritis in pregnancy carries a high risk of preterm labour and requires
    inpatient intravenous antibiotic treatment. UTI in a man under 50 without a clear
    precipitating factor (e.g. catheter) requires urological investigation to exclude
    structural pathology. Recurrent UTI in a woman — three or more episodes per year
    — warrants midstream urine culture confirmation, assessment for modifiable risk
    factors, and consideration of cystoscopy to exclude intravesical pathology.
    Macroscopic haematuria without infective symptoms requires cystoscopy to exclude
    bladder malignancy.

  diagnostic_context: |
    Urine dipstick testing is the appropriate first-line investigation for
    uncomplicated lower UTI in women — a positive nitrite result has high specificity
    for bacterial infection; combined nitrites and leukocytes increase sensitivity.
    Midstream urine (MSU) for microscopy, culture, and sensitivity should be sent
    before commencing antibiotics in: pyelonephritis, pregnancy, men, catheterised
    patients, recurrent or complicated UTI, and treatment failure. In sub-Saharan
    Africa, antibiotic resistance patterns — including extended-spectrum
    beta-lactamase (ESBL) producing E. coli — are increasingly prevalent and local
    susceptibility data should guide empirical choice. Asymptomatic bacteriuria
    (positive MSU without symptoms) should be treated only in pregnancy and prior to
    urological procedures; it does not require treatment in catheterised patients,
    elderly, or diabetic individuals without symptoms.
