name: CDS Pipeline

on:
  push:
    paths:
      - 'symptoms_dictionary/**'
      - 'ingest.py'
      - 'phase5/**'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest
        run: make ingest
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

      - name: Load Neo4j
        run: make load-neo4j
        env:
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}

      - name: Embed
        run: make embed
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

      - name: Eval (gate — retry up to 5x on Gemini 503, exponential backoff)
        run: |
          delays=(60 120 180 240)
          for i in 1 2 3 4 5; do
            make eval && break
            if [ $i -lt 5 ]; then
              wait=${delays[$((i-1))]}
              echo "Attempt $i failed — retrying in ${wait}s..."
              sleep $wait
            else
              echo "All 5 attempts failed."
              exit 1
            fi
          done
        env:
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
