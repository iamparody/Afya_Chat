# AFI Domain — Pairwise Disambiguation Pairs
# Source of truth: docs/domain_contracts/acute_febrile_illness.md §4
#
# Pathways are derived from §3 presentation matrix — do not curate independently.
# Condition names must match the `condition:` frontmatter field of the corpus card exactly.
# Terms in shared_features, discriminating_evidence, red_flags must exist in
# symptoms_dictionary/symptom_vocabulary.md before use.
#
# governance_pending: true  → source decision required before card authoring (§2.5)
#                             evaluation fixtures for this pair cannot be authored yet
# cross_domain: true        → one or both conditions are owned by another domain

pairs:

  # ── Mandatory safety pairs ──────────────────────────────────────────────────

  - pair_id: MSP-01
    priority: mandatory_safety
    condition_a: "Malaria (unspecified)"
    condition_b: "Meningitis (bacterial)"
    pathways: [P2, P1]
    governance_pending: false
    cross_domain: false
    shared_features:
      - fever
      - altered consciousness
      - headache
      - seizures
    discriminating_evidence:
      - positive malaria RDT
      - neck stiffness
      - purpura non-blanching
      - turbid CSF
    missing_information:
      - malaria RDT result
      - neck stiffness on examination
      - photophobia
      - rash presence and character
      - GCS and trend
    red_flags:
      - altered consciousness
      - purpura non-blanching
      - papilloedema
      - respiratory distress

